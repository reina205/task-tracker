<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Task Tracker</h1>
    <div class="controls">
      <select id="filter-priority">
        <option value="">All priorities</option>
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
      </select>
      <label class="overdue-toggle">
        <input type="checkbox" id="filter-overdue" />
        Overdue only
      </label>
      <input type="text" id="filter-tag" placeholder="Filter by tag" class="tag-filter-input" />
      <button id="new-task-btn">+ New Task</button>
    </div>
  </header>

  <main id="board" class="board">
    <section class="column" data-status="ToDo">
      <h2>To Do <span class="count" id="count-ToDo">0</span></h2>
      <div class="card-list" id="list-ToDo"></div>
    </section>
    <section class="column" data-status="InProgress">
      <h2>In Progress <span class="count" id="count-InProgress">0</span></h2>
      <div class="card-list" id="list-InProgress"></div>
    </section>
    <section class="column" data-status="Done">
      <h2>Done <span class="count" id="count-Done">0</span></h2>
      <div class="card-list" id="list-Done"></div>
    </section>
  </main>

  <div id="error-banner" class="error-banner hidden"></div>

  <dialog id="task-modal">
    <form id="task-form">
      <h3 id="modal-title">New Task</h3>
      <input type="hidden" id="task-id" />

      <label for="title">Title *</label>
      <input type="text" id="title" required maxlength="200" />

      <label for="description">Description</label>
      <textarea id="description" maxlength="2000"></textarea>

      <label for="priority">Priority</label>
      <select id="priority">
        <option value="Low">Low</option>
        <option value="Medium" selected>Medium</option>
        <option value="High">High</option>
      </select>

      <label for="assignee">Assignee</label>
      <input type="text" id="assignee" maxlength="100" />

      <label for="due-date">Due date</label>
      <input type="date" id="due-date" />

      <label for="tags">Tags <span class="hint">(comma-separated)</span></label>
      <input type="text" id="tags" placeholder="e.g. backend, urgent" maxlength="300" />

      <div class="modal-actions">
        <button type="button" id="delete-btn" class="danger hidden">Delete</button>
        <button type="button" id="cancel-btn">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
